<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arknights tools status</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23888'/></svg>">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5f6b7a; --line: #e3e6ea;
    --up: #1f9d55; --degraded: #d69e2e; --down: #d64545; --unknown: #a0a8b3; --empty: #e8ebef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #171b21; --text: #e6e9ed; --muted: #95a0ad; --line: #262c34;
      --up: #38c172; --degraded: #f2c94c; --down: #ef6461; --unknown: #6b7480; --empty: #232930; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .banner { border-radius: 10px; padding: 14px 16px; color: #fff; font-weight: 600;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .banner a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .banner .sub { font-weight: 400; }
  details.check { scroll-margin-top: 12px; }
  details.check.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--down) 14%, transparent); } 100% { background: transparent; } }
  .banner small { font-weight: 400; opacity: .9; }
  .banner.up { background: var(--up); } .banner.degraded { background: var(--degraded); color: #1b1f24; }
  .banner.down { background: var(--down); } .banner.unknown { background: var(--unknown); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .check { padding: 12px 16px; border-top: 1px solid var(--line); }
  .check:first-child { border-top: 0; }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(1px); }
  .name { font-weight: 600; }
  .name a { color: inherit; text-decoration: none; } .name a:hover { text-decoration: underline; }
  .right { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .desc, .msg { color: var(--muted); font-size: 13px; margin-left: 20px; }
  .msg.down { color: var(--down); } .msg.degraded { color: var(--degraded); }
  .msg a { color: inherit; }
  .bars { display: flex; gap: 2px; height: 26px; margin: 8px 0 2px 20px; }
  .bars i { flex: 1; border-radius: 2px; background: var(--empty); }
  .legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-left: 20px; }
  .s0 { background: var(--up) !important; } .s1 { background: var(--degraded) !important; }
  .s2 { background: var(--down) !important; } .s3 { background: var(--unknown) !important; }
  footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
  .error { background: var(--card); border: 1px solid var(--down); padding: 16px; border-radius: 10px; }
  @media (max-width: 560px) { .bars i:nth-child(-n+60) { display: none; } .legend .full { display: none; } .legend .short { display: inline !important; } .wide { display: none; } }
  details.check > summary { list-style: none; cursor: pointer; }
  details.check > summary::-webkit-details-marker { display: none; }
  details.check > summary:focus-visible { outline: 2px solid var(--muted); outline-offset: 4px; border-radius: 4px; }
  .chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); flex: none; margin-left: 4px; position: relative; top: -2px; transition: transform .15s; }
  details[open] .chev { transform: rotate(-135deg); top: 2px; }
  .details { margin: 12px 0 4px 20px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13px; }
  .details dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; overflow-wrap: anywhere; }
  .details code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--empty); padding: 1px 4px; border-radius: 4px; }
  .details h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
  .spark { width: 100%; height: 70px; display: block; background: var(--empty); border-radius: 6px; }
  .spark path { fill: none; stroke: var(--up); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .spark .failmark { fill: var(--down); opacity: .35; }
  .details .legend { margin-left: 0; }
  .inc { list-style: none; margin: 0; padding: 0; } .inc li { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  .muted { color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .links a { color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
  .links a:hover { background: var(--empty); }
  @media (max-width: 560px) { .details dl { grid-template-columns: 1fr; gap: 2px; } .details dd { margin-bottom: 6px; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Status</h1>
  <div id="app">Loading…</div>
  <footer>
    Checked every 5 minutes by GitHub Actions. Outages open an issue in
    <a id="repo-link" href="#">the status repo</a>.
  </footer>
</main>
<script type="module">
const NAMES = ['Operational', 'Degraded', 'Down', 'Unknown'];
const STATE = { up: 0, degraded: 1, down: 2, unknown: 3 };
const params = new URLSearchParams(location.search);
// On <owner>.github.io/<repo>/ read results from that repo's data branch; ?data=<url> overrides.
const owner = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : 'darkwebdev';
const repo = location.hostname.endsWith('.github.io') ? location.pathname.split('/')[1] || 'ak-status' : 'ak-status';
const dataBase = params.get('data') || `https://raw.githubusercontent.com/${owner}/${repo}/data/`;
document.getElementById('repo-link').href = `https://github.com/${owner}/${repo}/issues?q=label%3Aoutage`;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ago = (sec) => {
  const d = Math.max(0, Date.now() / 1000 - sec);
  return d < 90 ? 'just now' : d < 5400 ? `${Math.round(d / 60)} min ago` : d < 129600 ? `${Math.round(d / 3600)} h ago` : `${Math.round(d / 86400)} days ago`;
};
const pct = (n) => (n >= 99.995 ? '100' : n.toFixed(2)) + '%';

function uptime(samples, sinceSec) {
  const s = samples.filter((x) => x[0] >= sinceSec && x[1] !== 3);
  if (!s.length) return null;
  return (100 * s.filter((x) => x[1] === 0).length) / s.length;
}

function dayBars(days, n = 90) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const key = new Date(Date.now() - i * 86400e3).toISOString().slice(0, 10);
    const c = days?.[key];
    if (!c) { out.push(`<i title="${key}: no data"></i>`); continue; }
    const total = c[0] + c[1] + c[2];
    const cls = c[2] ? 's2' : c[1] ? 's1' : 's0';
    const up = (100 * c[0]) / total;
    out.push(`<i class="${cls}" title="${key}: ${pct(up)} up${c[2] ? `, ${c[2]} failed checks` : ''}"></i>`);
  }
  return out.join('');
}

const openIds = new Set();
document.addEventListener('toggle', (e) => {
  const id = e.target?.dataset?.id;
  if (!id) return;
  e.target.open ? openIds.add(id) : openIds.delete(id);
}, true);

const fmtTime = (sec) => new Date(sec * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtDur = (s) => (s < 3600 ? `${Math.max(1, Math.round(s / 60))} min` : s < 172800 ? `${(s / 3600).toFixed(1)} h` : `${Math.round(s / 86400)} days`);

function whatIsChecked(c) {
  const code = (t) => `<code>${esc(t)}</code>`;
  switch (c.type) {
    case 'page':
      return `GET ${code(c.url)}, expects HTTP 200${c.contains ? `, page containing ${code(c.contains)}` : ''}${c.assets !== false ? ', and its script bundles load' : ''}.`;
    case 'http':
      return `${c.method || 'GET'} ${c.networkConfig ? `${code(c.path)} on the ${code(c.domain)} server from Yostar's network config` : code(c.url)}${c.body ? ` with body ${code(JSON.stringify(c.body))}` : ''}, expects ${c.expectStatusBelow ? `any reply below HTTP ${c.expectStatusBelow}` : `HTTP ${c.expectStatus ?? 200}`}.`;
    case 'graphql':
      return `POST ${code(c.url)} with ${code(c.query)}, expects ${code(c.expect.path)} = ${code(JSON.stringify(c.expect.equals))}.`;
    case 'json':
      return c.expect
        ? `GET ${code(c.url)}, expects JSON with ${code(c.expect.path)}${'equals' in c.expect ? ` = ${code(JSON.stringify(c.expect.equals))}` : ' present'}.`
        : `GET ${code(c.url)}, expects a non-empty JSON object.`;
    case 'assetcdn':
      return `Reads the live ${code('resVersion')} from ${code(c.versionUrl)}, then GETs ${code(c.assetBase + '/Android/assets/<resVersion>/hot_update_list.json')}, which must list asset bundles.`;
    case 'yostarplat':
      return `Signed POST (like the game client) to ${code(c.url)} with ${code(JSON.stringify(c.body))}. Yostar must answer with a JSON <code>Code</code>. The email is malformed on purpose, so nothing is sent.`;
    case 'cors':
      return `OPTIONS preflight to ${code(c.url)} from ${code(c.origin)}, expects that origin to be allowed.`;
    case 'workflow':
      return `Latest completed run of ${code(c.workflow)} in ${code(c.repo)} must have succeeded${c.maxAgeHours ? `, and the last success must be under ${c.maxAgeHours} h old` : ''}.`;
  }
  return '';
}

function incidents(h) {
  const out = [];
  let cur = null;
  for (const [t, s] of h) {
    if (s === 2) { if (!cur) cur = { start: t, end: null, n: 0 }; cur.n++; cur.last = t; }
    else if (cur) { cur.end = t; out.push(cur); cur = null; }
  }
  if (cur) out.push(cur);
  return out.reverse();
}

function sparkline(h, nowSec) {
  const pts = h.filter((x) => x[0] >= nowSec - 86400 && x[2] != null);
  if (pts.length < 2) return '<div class="muted">Not enough data yet.</div>';
  const W = 600, H = 70, max = Math.max(...pts.map((p) => p[2]), 100);
  const x = (t) => ((t - (nowSec - 86400)) / 86400) * W;
  const y = (ms) => H - 4 - (ms / max) * (H - 8);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[2]).toFixed(1)}`).join('');
  const fails = pts.filter((p) => p[1] === 2).map((p) => `<rect x="${(x(p[0]) - 1.5).toFixed(1)}" y="0" width="3" height="${H}" class="failmark"/>`).join('');
  const avg = Math.round(pts.reduce((a, p) => a + p[2], 0) / pts.length);
  const sorted = pts.map((p) => p[2]).sort((a, b) => a - b);
  const p95 = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="spark" role="img" aria-label="Response time, last 24 hours">${fails}<path d="${line}"/></svg>
    <div class="legend"><span>24 h ago</span><span>avg ${avg} ms · p95 ${p95} ms · max ${Math.round(max)} ms</span><span>now</span></div>`;
}

function detailsHtml(c, r, h, nowSec) {
  const rows = [
    ['Checks', whatIsChecked(c)],
    ['Runs', `every ${c.everyMinutes || 5} min${c.slowMs ? ` · slower than ${c.slowMs} ms counts as degraded` : ''}`],
    ['Last check', `${fmtTime(r.checkedAt)}${r.ms != null && c.type !== 'workflow' ? ` · ${r.ms} ms` : ''}`],
    ['Result', `<span class="msg ${r.state}" style="margin:0">${esc(r.message)}</span>`],
  ];
  if (r.info) {
    for (const [k, v] of Object.entries(r.info)) rows.push([k, `<code>${esc(v)}</code>`]);
    rows.push(['Last version change', r.infoChangedAt ? `${fmtTime(Date.parse(r.infoChangedAt) / 1000)} (${ago(Date.parse(r.infoChangedAt) / 1000)})` : 'not seen yet (tracking since this check was added)']);
  }
  if (r.state === 'down') rows.push(['Down since', `${fmtTime(Date.parse(r.downSince) / 1000)} (${fmtDur(nowSec - Date.parse(r.downSince) / 1000)}) · ${r.failures} failed checks in a row`]);
  const inc = incidents(h).slice(0, 5);
  const incHtml = inc.length
    ? `<ul class="inc">${inc.map((i) => `<li><span class="dot s2"></span>${fmtTime(i.start)} · ${i.end ? `lasted ${fmtDur(i.end - i.start)}` : `ongoing, ${fmtDur(nowSec - i.start)}`} · ${i.n} failed check${i.n > 1 ? 's' : ''}</li>`).join('')}</ul>`
    : '<div class="muted">No failures in the last 7 days.</div>';
  return `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${c.type !== 'workflow' ? `<h3>Response time</h3>${sparkline(h, nowSec)}` : ''}
    <h3>Recent failures (7 days)</h3>${incHtml}`;
}

async function getJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}

async function render() {
  const bust = `?t=${Math.floor(Date.now() / 60000)}`;
  const [config, status, history, daily] = await Promise.all([
    getJson('./config.json'),
    getJson(dataBase + 'status.json' + bust),
    getJson(dataBase + 'history.json' + bust).catch(() => ({})),
    getJson(dataBase + 'daily.json' + bust).catch(() => ({})),
  ]);
  document.title = config.title;
  document.getElementById('title').textContent = config.title;
  const all = config.groups.flatMap((g) => g.checks);
  const down = all.filter((c) => status.checks[c.id]?.state === 'down');
  const degraded = all.filter((c) => status.checks[c.id]?.state === 'degraded');
  const overall = down.length ? 'down' : degraded.length ? 'degraded' : 'up';
  const jump = (c) => `<a href="#check-${esc(c.id)}" data-jump="${esc(c.id)}">${esc(c.name)}</a>`;
  const headline = down.length
    ? `${down.length === 1 ? 'Failing:' : `${down.length} checks failing:`} ${down.map(jump).join(', ')}${degraded.length ? ` <span class="sub">· degraded: ${degraded.map(jump).join(', ')}</span>` : ''}`
    : degraded.length ? `Degraded: ${degraded.map(jump).join(', ')}` : 'All systems operational';
  const color = getComputedStyle(document.documentElement).getPropertyValue(`--${overall}`).trim();
  document.getElementById('favicon').href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='${encodeURIComponent(color)}'/></svg>`;

  const nowSec = Date.now() / 1000;
  let html = `<div class="banner ${overall}"><span>${headline}</span><small>Updated ${ago(status.updatedAt)}</small></div>`;
  for (const g of config.groups) {
    html += `<h2>${esc(g.name)}</h2><div class="group">`;
    for (const c of g.checks) {
      const r = status.checks[c.id] || { state: 'unknown', message: 'not checked yet' };
      const h = history[c.id] || [];
      const u24 = uptime(h, nowSec - 86400);
      const u7 = uptime(h, nowSec - 7 * 86400);
      const st = STATE[r.state] ?? 3;
      const href = c.url && c.type === 'page' ? c.url : c.repo ? `https://github.com/${c.repo}/actions/workflows/${c.workflow}` : null;
      const timing = c.type === 'workflow' ? '' : r.ms != null ? `<span class="wide">${r.ms} ms · </span>` : '';
      const ups = [u24 != null && `${pct(u24)} 24h`, u7 != null && `<span class="wide">${pct(u7)} 7d</span>`].filter(Boolean).join('<span class="wide"> · </span>');
      const links = [
        r.issue && ['Outage issue', r.issue],
        r.link && ['Latest workflow run', r.link],
        r.log && ['Check log', r.log],
        href && [c.type === 'page' ? 'Open site' : 'Workflow runs', href],
      ].filter(Boolean);
      html += `<details class="check" id="check-${esc(c.id)}" data-id="${esc(c.id)}"${openIds.has(c.id) ? ' open' : ''}>
        <summary>
          <div class="row"><span class="dot s${st}" title="${NAMES[st]}"></span><span class="name">${esc(c.name)}</span>
            <span class="right">${timing}${ups || NAMES[st]}</span><span class="chev" aria-hidden="true"></span></div>
          ${c.description ? `<div class="desc">${esc(c.description)}</div>` : ''}
          <div class="msg ${r.state}">${NAMES[st]}: ${esc(r.message)} · ${ago(r.checkedAt)}</div>
          <div class="bars">${dayBars(daily[c.id])}</div>
          <div class="legend"><span><span class="full">90 days ago</span><span class="short" style="display:none">30 days ago</span></span><span>Today</span></div>
        </summary>
        <div class="details">${detailsHtml(c, r, h, nowSec)}
          ${links.length ? `<div class="links">${links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}</div>` : ''}
        </div>
      </details>`;
    }
    html += '</div>';
  }
  document.getElementById('app').innerHTML = html;
}

function jumpTo(id, smooth = true) {
  const el = document.getElementById(`check-${id}`);
  if (!el) return;
  el.open = true;
  openIds.add(id);
  el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-jump]');
  if (!a) return;
  e.preventDefault();
  history.replaceState(null, '', a.getAttribute('href'));
  jumpTo(a.dataset.jump);
});
let jumpedFromHash = false;

async function tick() {
  try {
    await render();
    if (!jumpedFromHash && location.hash.startsWith('#check-')) {
      jumpedFromHash = true;
      jumpTo(location.hash.slice(7), false);
    }
  }
  catch (e) {
    document.getElementById('app').innerHTML = `<div class="error">Couldn't load status data. The first check run may not have finished yet.<br><small>${esc(e.message)}</small></div>`;
  }
}
tick();
setInterval(tick, 60000);
</script>
</body>
</html>
